name: CI

on:
  push:
    branches: ['dev', '**']
  pull_request:
    branches: ['dev', '**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    name: Test TypeScript
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: pnpm-ci
        run: npm run setup

      - name: Check Format
        id: pnpm-format-check
        run: pnpm run format:check

      - name: Lint
        id: pnpm-lint
        run: pnpm run lint

      - name: Test
        id: pnpm-test
        run: pnpm run test

  test-action:
    runs-on: ubuntu-latest
    name: Test Action
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          milliseconds: 2000

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.time }}"
